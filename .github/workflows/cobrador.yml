name: Cobrador de Envio
on: {workflow_dispatch: {inputs: {origem: {required: false, description: 'disparo manual'}}}, schedule: [{cron: '0 9 * * 1'}, {cron: '0 9 1 * *'}]}

permissions:
  issues: write

jobs:
  cobrar:
    runs-on: ubuntu-latest
    steps:
      - name: Cobrança
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json"             https://api.github.com/repos/${{ github.repository }}/issues             -d '{"title":"COBRANÇA SEMANAL: artefato enviado?","body":"Perguntas: 1) artefato enviado ao validador? sim/não 2) o que foi adiado e por quê? 3) data realista? Responda por escrito aqui."}'
