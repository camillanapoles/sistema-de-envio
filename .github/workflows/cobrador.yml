name: Cobrador de Envio
on: {workflow_dispatch: {inputs: {origem: {required: false, description: 'disparo manual'}}}, schedule: [{cron: '0 9 * * 1'}, {cron: '0 9 1 * *'}]}

permissions:
  issues: write

jobs:
  cobrar:
    runs-on: ubuntu-latest
    steps:
      - name: Cobrança semanal
        if: github.event.schedule == '0 9 * * 1' || github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/issues"             -d '{"title":"COBRANÇA SEMANAL: artefato enviado?","body":"Perguntas obrigatórias (responda por escrito nesta issue): 1) O artefato em voo foi enviado ao validador? sim/não. 2) Se não: o que exatamente foi adiado e por quê? 3) A data de envio do contrato continua realista? sim/não. Lembrete: adiar é dado, não vergonha. Não responder é omissão."}'
      - name: Métrica mensal
        if: github.event.schedule == '0 9 1 * *'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/issues"             -d '{"title":"MÉTRICA MENSAL: portfólio real","body":"Conte e registre: quantos artefatos EXISTEM FORA DO SEU CONTROLE este mês? Atualize 01-PORTFOLIO-REAL.md (seção ENVIADOS). Zero é um dado — registre o zero com a mesma honestidade."}'
