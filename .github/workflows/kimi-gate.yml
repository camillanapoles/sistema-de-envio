name: Kimi Gate Hook
on: {issues: {types: [labeled]}, issue_comment: {types: [created]}}

permissions: {issues: write}

jobs:
  hook:
    runs-on: ubuntu-latest
    steps:
      - name: Guarda do gate
        id: guarda
        if: ${{ (github.event_name == 'issues' && github.event.label.name == 'kimi-gate') || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/kimi ') && github.event.comment.user.type != 'Bot') }}
        run: echo "ATIVO"
      - name: Registrar WAL e enfileirar
        if: ${{ steps.guarda.outcome == 'success' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BODY=$(jq -n --arg ts "$TS" \
            --arg evento "${{ github.event_name }}" \
            --arg ator "${{ github.actor }}" \
            --arg num "$ISSUE" \
            --arg payload "${{ github.event.comment.body }}" \
            '{body: ("## WAL-ENTRY [" + $ts + "]\n- evento: " + $evento + "\n- ator: " + $ator + "\n- issue: #" + $num + "\n- fila: kimi\n- status: AGUARDANDO_KIMI\n\n---\n### PAYLOAD\n" + ($payload // "(via label kimi-gate)"))}')
          curl -sf -X POST -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE/comments" -d "$BODY"
          curl -sf -X POST -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE/labels" -d '{"labels":["fila-kimi"]}'
