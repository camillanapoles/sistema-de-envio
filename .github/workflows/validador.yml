name: Validador CI (gate objetivo)
on: {push: {}, pull_request: {}, workflow_dispatch: {}}

permissions: {issues: write, contents: read}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate deterministico
        env:
          GT: ${{ secrets.GITHUB_TOKEN }}
          REPOF: ${{ github.repository }}
          CONTRACT: 00-CONTRATO-DE-ENVIO.md
        run: |
          FALHAS=""
          [ -f "$CONTRACT" ] || FALHAS="$FALHAS; contrato ausente"
          if [ -f "$CONTRACT" ]; then
            grep -q "VALIDADOR.*_" "$CONTRACT" && FALHAS="$FALHAS; campo validador em branco"
            grep -oE 'https://[^ )]+' "$CONTRACT" | sort -u > links.txt || true
            while read -r u; do
              curl -sf -o /dev/null -m 10 "$u" || FALHAS="$FALHAS; link morto: $u"
            done < links.txt
          fi
          if [ -n "$FALHAS" ]; then
            echo "REJECT$FALHAS"
            BODY=$(jq -n --arg f "${FALHAS#; }" '{title: "GATE REJECT", body: ("/kimi gate reprovou: " + $f + ". Diagnostique e agende correção mínima aqui (bundling obrigatório).")}')
            curl -sf -X POST -H "Authorization: token $GT" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOF/issues" -d "$BODY"
            exit 1
          fi
          echo "APPROVE"
